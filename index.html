<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Juego Hexagonal y Catálogo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Colores exactos de la paleta solicitada */
            --brand-orange: #EF9322;
            --brand-green: #637C2E;
            --brand-purple: #68598A;
            --brand-black: #000000;
            --brand-white: #FFFFFF;
            
            --slot-bg: #f3f4f6;
            --slot-border: #d1d5db;

            /* Variables de escalado responsivo para el hexágono */
            /* El tamaño base del hexágono varía fluidamente entre 60px y 100px dependiendo del ancho de la pantalla */
            --hex-size: clamp(60px, 16vw, 100px); 
            
            /* Cálculos geométricos del hexágono para el tablero (Pointy-topped) */
            --step-x: calc(var(--hex-size) * 0.866); /* Distancia horizontal entre centros: (sqrt(3)/2) * width */
            --step-y: calc(var(--hex-size) * 0.75);  /* Distancia vertical entre centros: 3/4 * height */
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
            color: #111827;
            overflow-x: hidden;
            overscroll-behavior-y: contain; /* Evita "pull to refresh" en móviles al jugar */
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .fade-transition {
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .hidden-section {
            opacity: 0;
            pointer-events: none;
            position: absolute;
            width: 100%;
            transform: scale(0.98);
        }
        .active-section {
            opacity: 1;
            pointer-events: auto;
            position: relative;
            width: 100%;
            transform: scale(1);
            z-index: 10;
        }

        .board-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            width: 100%;
            overflow: visible;
        }

        /* El contenedor del tablero auto-calcula su tamaño según las variables responsivas */
        .flat-board {
            position: relative;
            width: calc(var(--step-x) * 3 + var(--hex-size));
            height: calc(var(--step-y) * 2 + var(--hex-size));
        }

        .slot {
            position: absolute;
            width: var(--hex-size);
            height: var(--hex-size);
            box-sizing: border-box;
            transition: all 0.2s ease;
            z-index: 1;
        }

        .slot-svg {
            width: 100%;
            height: 100%;
            fill: var(--slot-bg);
            stroke: var(--slot-border);
            stroke-width: 2px;
            transition: all 0.3s ease;
        }

        .slot.drag-over .slot-svg {
            fill: #e5e7eb;
            stroke: var(--brand-green);
            stroke-width: 3px;
        }

        .piece {
            width: var(--hex-size);
            height: var(--hex-size);
            cursor: grab;
            position: relative;
            z-index: 20;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* ESENCIAL para móvil: Bloquea el scroll de la ventana al tocar las piezas */
        }
        .piece:active { cursor: grabbing; }

        .piece-svg-container {
            width: 100%;
            height: 100%;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 3px 5px rgba(0,0,0,0.25));
        }

        .piece-svg {
            width: 100%;
            height: 100%;
            fill: var(--brand-black);
        }

        .piece.in-slot {
            position: absolute;
            top: 0; left: 0;
            z-index: 10;
        }

        .piece-dock {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(0.5rem, 2vw, 1rem);
            padding: clamp(0.75rem, 2vw, 1.5rem);
            border-radius: 1rem;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        #drag-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 99999;
        }

        .is-dragging {
            pointer-events: none !important; 
            position: absolute !important;
            z-index: 100000;
            transform: scale(1.1);
            transition: transform 0.1s ease;
        }
        
        .is-dragging .piece-svg-container {
            filter: drop-shadow(0 15px 20px rgba(0,0,0,0.4));
        }

        .btn-locked {
            background-color: #d1d5db !important; /* Gris */
            color: #6b7280 !important;
            cursor: not-allowed;
            box-shadow: none !important;
            transform: none !important;
        }
        
        .btn-unlocked {
            background-color: var(--brand-green) !important;
            color: var(--brand-white) !important;
            box-shadow: 0 10px 15px -3px rgba(99, 124, 46, 0.4) !important;
            cursor: pointer;
        }
        
        .btn-unlocked:hover {
            background-color: #536926 !important; /* Verde más oscuro */
        }
    </style>
</head>
<body>

    <header class="w-full p-4 bg-white shadow-sm z-50 flex flex-col sm:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-3 w-full sm:w-auto justify-center">
            <img src="Logo HL.png" alt="Homo Ludens Logo" class="h-16 sm:h-20 drop-shadow-md" />
        </div>
        <div class="flex items-center gap-3 w-full sm:w-auto">
            <button id="skip-btn" class="flex-1 sm:flex-none px-4 py-2.5 bg-white text-[#EF9322] border-2 border-[#EF9322] rounded-lg font-bold transition-all active:scale-95 hover:bg-orange-50 text-sm whitespace-nowrap">
                Omitir Juego
            </button>
            <button id="catalog-btn" class="flex-1 sm:flex-none px-4 py-2.5 rounded-lg font-bold transition-all text-sm flex items-center justify-center gap-2 btn-locked whitespace-nowrap" disabled>
                <!-- Candado Cerrado -->
                <svg id="icon-locked" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
                <!-- Candado Abierto (Oculto por defecto) -->
                <svg id="icon-unlocked" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"></path>
                </svg>
                <span>Ver Catálogo</span>
            </button>
        </div>
    </header>

    <div class="flex-1 relative w-full flex flex-col items-center overflow-hidden">
        
        <main id="game-section" class="active-section flex flex-col items-center flex-1 pb-10 fade-transition">
            <div class="text-center px-4 mt-4 sm:mt-6">
                <h2 class="text-xl sm:text-2xl font-bold text-black">Acomoda las piezas</h2>
                <p class="text-gray-500 mt-1 text-xs sm:text-sm max-w-md mx-auto">
                    Arrastra y suelta las 5 piezas. Haz clic o tócalas para rotarlas 60°.
                </p>
            </div>

            <div class="board-container my-4">
                <div class="flat-board" id="board">
                    <!-- Fila 1 (Posiciones dinámicas responsivas vía variables CSS) -->
                    <div class="slot" style="left: calc(var(--step-x) * 0.5); top: 0px;" data-id="s0"></div>
                    <div class="slot" style="left: calc(var(--step-x) * 1.5); top: 0px;" data-id="s1"></div>
                    <div class="slot" style="left: calc(var(--step-x) * 2.5); top: 0px;" data-id="s2"></div>
                    
                    <!-- Fila 2 -->
                    <div class="slot" style="left: 0px; top: var(--step-y);" data-id="s3"></div>
                    <div class="slot" style="left: calc(var(--step-x) * 1); top: var(--step-y);" data-id="s4"></div>
                    <div class="slot" style="left: calc(var(--step-x) * 2); top: var(--step-y);" data-id="s5"></div>
                    <div class="slot" style="left: calc(var(--step-x) * 3); top: var(--step-y);" data-id="s6"></div>
                    
                    <!-- Fila 3 -->
                    <div class="slot" style="left: calc(var(--step-x) * 0.5); top: calc(var(--step-y) * 2);" data-id="s7"></div>
                    <div class="slot" style="left: calc(var(--step-x) * 1.5); top: calc(var(--step-y) * 2);" data-id="s8"></div>
                    <div class="slot" style="left: calc(var(--step-x) * 2.5); top: calc(var(--step-y) * 2);" data-id="s9"></div>
                </div>
            </div>

            <div class="w-full max-w-3xl px-4 mt-2">
                <div class="piece-dock" id="dock">
                    <!-- Pieza 1 -->
                    <div class="piece" data-rot="0">
                        <div class="piece-svg-container">
                            <svg viewBox="0 0 100 100" class="piece-svg">
                                <polygon points="50,0 93.3,25 93.3,75 50,100 6.7,75 6.7,25"/>
                                <path d="M 71.65 12.5 L 28.35 87.5" fill="none" stroke="var(--brand-orange)" stroke-width="14" stroke-linecap="round"/>
                                <path d="M 93.3 50 Q 65 65 71.65 87.5" fill="none" stroke="var(--brand-green)" stroke-width="14" stroke-linecap="round"/>
                                <path d="M 6.7 50 Q 35 35 28.35 12.5" fill="none" stroke="var(--brand-purple)" stroke-width="14" stroke-linecap="round"/>
                            </svg>
                        </div>
                    </div>
                    <!-- Pieza 2 -->
                    <div class="piece" data-rot="0">
                        <div class="piece-svg-container">
                            <svg viewBox="0 0 100 100" class="piece-svg">
                                <polygon points="50,0 93.3,25 93.3,75 50,100 6.7,75 6.7,25"/>
                                <path d="M 93.3 50 L 6.7 50" fill="none" stroke="var(--brand-green)" stroke-width="14" stroke-linecap="round"/>
                                <path d="M 28.35 12.5 Q 50 35 71.65 12.5" fill="none" stroke="var(--brand-orange)" stroke-width="14" stroke-linecap="round"/>
                                <path d="M 71.65 87.5 Q 50 65 28.35 87.5" fill="none" stroke="var(--brand-purple)" stroke-width="14" stroke-linecap="round"/>
                            </svg>
                        </div>
                    </div>
                    <!-- Pieza 3 -->
                    <div class="piece" data-rot="0">
                        <div class="piece-svg-container">
                            <svg viewBox="0 0 100 100" class="piece-svg">
                                <polygon points="50,0 93.3,25 93.3,75 50,100 6.7,75 6.7,25"/>
                                <path d="M 71.65 87.5 L 28.35 12.5" fill="none" stroke="var(--brand-purple)" stroke-width="14" stroke-linecap="round"/>
                                <path d="M 28.35 87.5 Q 35 65 6.7 50" fill="none" stroke="var(--brand-green)" stroke-width="14" stroke-linecap="round"/>
                                <path d="M 71.65 12.5 Q 65 35 93.3 50" fill="none" stroke="var(--brand-orange)" stroke-width="14" stroke-linecap="round"/>
                            </svg>
                        </div>
                    </div>
                    <!-- Pieza 4 -->
                    <div class="piece" data-rot="0">
                        <div class="piece-svg-container">
                            <svg viewBox="0 0 100 100" class="piece-svg">
                                <polygon points="50,0 93.3,25 93.3,75 50,100 6.7,75 6.7,25"/>
                                <path d="M 71.65 12.5 Q 40 50 71.65 87.5" fill="none" stroke="var(--brand-green)" stroke-width="14" stroke-linecap="round"/>
                                <path d="M 28.35 87.5 Q 60 50 28.35 12.5" fill="none" stroke="var(--brand-orange)" stroke-width="14" stroke-linecap="round"/>
                                <path d="M 93.3 50 L 6.7 50" fill="none" stroke="var(--brand-purple)" stroke-width="14" stroke-linecap="round"/>
                            </svg>
                        </div>
                    </div>
                    <!-- Pieza 5 -->
                    <div class="piece" data-rot="0">
                        <div class="piece-svg-container">
                            <svg viewBox="0 0 100 100" class="piece-svg">
                                <polygon points="50,0 93.3,25 93.3,75 50,100 6.7,75 6.7,25"/>
                                <path d="M 93.3 50 Q 50 40 28.35 87.5" fill="none" stroke="var(--brand-orange)" stroke-width="14" stroke-linecap="round"/>
                                <path d="M 6.7 50 Q 50 60 71.65 12.5" fill="none" stroke="var(--brand-purple)" stroke-width="14" stroke-linecap="round"/>
                                <path d="M 71.65 87.5 L 28.35 12.5" fill="none" stroke="var(--brand-green)" stroke-width="14" stroke-linecap="round"/>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <main id="catalog-section" class="hidden-section w-full max-w-6xl mx-auto p-6 lg:p-12 fade-transition min-h-[70vh]">
            <div class="mb-10 border-b border-gray-200 pb-4">
                <h2 class="text-3xl font-extrabold text-black">Catálogo Exclusivo</h2>
                <p class="text-gray-500 mt-2">Selecciona una de las opciones disponibles.</p>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div class="bg-white rounded-xl shadow-md border border-gray-100 p-10 flex items-center justify-center min-h-[250px] hover:shadow-lg transition-shadow">
                    <h3 class="text-2xl font-bold text-gray-800">Opción 1</h3>
                </div>
                <div class="bg-white rounded-xl shadow-md border border-gray-100 p-10 flex items-center justify-center min-h-[250px] hover:shadow-lg transition-shadow">
                    <h3 class="text-2xl font-bold text-gray-800">Opción 2</h3>
                </div>
                <div class="bg-white rounded-xl shadow-md border border-gray-100 p-10 flex items-center justify-center min-h-[250px] hover:shadow-lg transition-shadow">
                    <h3 class="text-2xl font-bold text-gray-800">Opción 3</h3>
                </div>
            </div>
        </main>
    </div>

    <!-- Capa flotante necesaria para sacar las piezas de su contenedor al arrastrarlas -->
    <div id="drag-layer"></div>

    <script>
        const gameSection = document.getElementById('game-section');
        const catalogSection = document.getElementById('catalog-section');
        const skipBtn = document.getElementById('skip-btn');
        const catalogBtn = document.getElementById('catalog-btn');
        const iconLocked = document.getElementById('icon-locked');
        const iconUnlocked = document.getElementById('icon-unlocked');
        
        const dragLayer = document.getElementById('drag-layer');
        const dock = document.getElementById('dock');
        const slots = document.querySelectorAll('.slot');
        const pieces = document.querySelectorAll('.piece');

        // Dibujar el contorno hexagonal dentro de cada slot del tablero
        const emptyHexSVG = `
            <svg viewBox="0 0 100 100" class="slot-svg">
                <polygon points="50,0 93.3,25 93.3,75 50,100 6.7,75 6.7,25" />
            </svg>
        `;
        slots.forEach(slot => { slot.innerHTML = emptyHexSVG; });

        let isUnlocked = false;

        function unlockCatalog() {
            if (isUnlocked) return;
            isUnlocked = true;
            
            // Actualización visual del botón
            catalogBtn.classList.remove('btn-locked');
            catalogBtn.classList.add('btn-unlocked');
            catalogBtn.removeAttribute('disabled');
            
            iconLocked.classList.add('hidden');
            iconUnlocked.classList.remove('hidden');
        }

        function showCatalog() {
            if (!isUnlocked) return;
            gameSection.classList.remove('active-section');
            gameSection.classList.add('hidden-section');
            
            setTimeout(() => {
                catalogSection.classList.remove('hidden-section');
                catalogSection.classList.add('active-section');
                skipBtn.style.display = 'none';
            }, 300);
        }

        skipBtn.addEventListener('click', unlockCatalog);
        catalogBtn.addEventListener('click', showCatalog);

        let draggedPiece = null;
        let originalParent = null;
        let dragStartX, dragStartY;
        let offsetX, offsetY;
        let hasMoved = false;

        function checkWinCondition() {
            const placedPieces = Array.from(slots).filter(slot => slot.querySelector('.piece'));
            if (placedPieces.length === 5) {
                unlockCatalog();
            }
        }

        function rotatePiece(piece) {
            let rot = parseInt(piece.getAttribute('data-rot') || 0);
            rot = (rot + 1) % 6;
            piece.setAttribute('data-rot', rot);
            const container = piece.querySelector('.piece-svg-container');
            container.style.transform = `rotate(${rot * 60}deg)`;
        }

        // Función para normalizar eventos táctiles vs mouse
        function getCoords(e) {
            if (e.touches && e.touches.length > 0) {
                return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            } else if (e.changedTouches && e.changedTouches.length > 0) {
                return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
            }
            return { x: e.clientX, y: e.clientY };
        }

        function startDrag(e) {
            const piece = e.target.closest('.piece');
            if (!piece) return;
            if (e.type === 'mousedown' && e.button !== 0) return; // Solo click izquierdo

            // Evitar scroll en móviles
            if (e.type.startsWith('touch')) {
                if (e.cancelable) e.preventDefault();
            } else {
                e.preventDefault();
            }

            draggedPiece = piece;
            originalParent = piece.parentElement;
            hasMoved = false;

            const coords = getCoords(e);
            dragStartX = coords.x;
            dragStartY = coords.y;

            const rect = piece.getBoundingClientRect();
            // Calcular offset exacto manteniendo las dimensiones reales (escaladas) de la pieza en pantalla
            offsetX = coords.x - rect.left;
            offsetY = coords.y - rect.top;

            // Fija el tamaño actual para que no "salte" al pasar a fixed
            piece.style.width = `${rect.width}px`;
            piece.style.height = `${rect.height}px`;

            // Mover la pieza al nivel más alto (Capa de Arrastre)
            dragLayer.appendChild(piece);
            piece.classList.add('is-dragging');
            piece.classList.remove('in-slot');
            
            updatePosition(coords.x, coords.y);

            document.addEventListener('mousemove', dragMove, { passive: false });
            document.addEventListener('touchmove', dragMove, { passive: false });
            document.addEventListener('mouseup', endDrag);
            document.addEventListener('touchend', endDrag);
        }

        function dragMove(e) {
            if (!draggedPiece) return;
            if (e.cancelable) e.preventDefault();
            
            const coords = getCoords(e);
            // Umbral de 5px para diferenciar un "click/tap" de un "drag" real
            if (Math.abs(coords.x - dragStartX) > 5 || Math.abs(coords.y - dragStartY) > 5) {
                hasMoved = true;
            }

            updatePosition(coords.x, coords.y);

            // Detectar el slot que está debajo temporalmente ocultando la pieza
            draggedPiece.style.visibility = 'hidden';
            const hit = document.elementFromPoint(coords.x, coords.y);
            draggedPiece.style.visibility = 'visible';

            slots.forEach(s => s.classList.remove('drag-over'));
            if (hit) {
                const slot = hit.closest('.slot');
                if (slot && !slot.querySelector('.piece')) {
                    slot.classList.add('drag-over');
                }
            }
        }

        function updatePosition(x, y) {
            draggedPiece.style.left = `${x - offsetX}px`;
            draggedPiece.style.top = `${y - offsetY}px`;
        }

        function endDrag(e) {
            if (!draggedPiece) return;

            document.removeEventListener('mousemove', dragMove);
            document.removeEventListener('touchmove', dragMove);
            document.removeEventListener('mouseup', endDrag);
            document.removeEventListener('touchend', endDrag);

            const piece = draggedPiece;
            draggedPiece = null;
            
            piece.classList.remove('is-dragging');
            slots.forEach(s => s.classList.remove('drag-over'));
            
            // Limpiar estilos inline fijos
            piece.style.left = '';
            piece.style.top = '';
            piece.style.width = '';
            piece.style.height = '';

            // Si fue solo un tap/click, rotar la pieza
            if (!hasMoved) {
                originalParent.appendChild(piece);
                if (originalParent.classList.contains('slot')) piece.classList.add('in-slot');
                rotatePiece(piece);
                checkWinCondition();
                return;
            }

            const coords = getCoords(e);
            
            // Detectar dónde fue soltada la pieza
            piece.style.visibility = 'hidden';
            const hit = document.elementFromPoint(coords.x, coords.y);
            piece.style.visibility = 'visible';

            let droppedInSlot = false;
            if (hit) {
                const slot = hit.closest('.slot');
                if (slot && !slot.querySelector('.piece')) {
                    slot.appendChild(piece);
                    piece.classList.add('in-slot');
                    droppedInSlot = true;
                }
            }

            // Si no cayó en un slot válido, vuelve al dock
            if (!droppedInSlot) {
                dock.appendChild(piece);
                piece.classList.remove('in-slot');
            }

            checkWinCondition();
        }

        // Vincular los eventos a cada pieza
        pieces.forEach(p => {
            p.addEventListener('mousedown', startDrag);
            p.addEventListener('touchstart', startDrag, { passive: false });
        });

    </script>
</body>
</html>
