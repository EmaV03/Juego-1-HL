<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Meta tags for touch and responsiveness -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Juego Hexagonal y Catálogo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Colores de la paleta solicitada */
            --brand-orange: #E66622;
            --brand-green: #1B371C;
            --brand-purple: #47336E;
            --brand-black: #000000;
            --brand-white: #FFFFFF;
            
            --slot-bg: #e5e7eb;
            --slot-border: #9ca3af;

            /* Variables de escalado para hexágonos (Flat-topped) */
            /* El ancho es el doble del radio, la altura es sqrt(3) * radio */
            --hex-radius: clamp(35px, 9vw, 55px); 
            --hex-w: calc(var(--hex-radius) * 2);
            --hex-h: calc(var(--hex-radius) * 1.73205);
            
            /* Distancias en el tablero axial */
            --step-x: calc(var(--hex-radius) * 1.5);
            --step-y: var(--hex-h);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
            color: #111827;
            overflow-x: hidden;
            overscroll-behavior-y: contain; /* Previene recargar la página al arrastrar en móvil */
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Transiciones de secciones */
        .fade-transition {
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .hidden-section {
            opacity: 0;
            pointer-events: none;
            position: absolute;
            width: 100%;
            transform: scale(0.98);
        }
        .active-section {
            opacity: 1;
            pointer-events: auto;
            position: relative;
            width: 100%;
            transform: scale(1);
            z-index: 10;
        }

        /* Contenedor del tablero escalable */
        .board-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            width: 100%;
        }

        /* Calculamos el tamaño del tablero base en la cuadrícula de 10 huecos */
        .flat-board {
            position: relative;
            width: calc(var(--step-x) * 3 + var(--hex-w));
            height: calc(var(--step-y) * 2 + var(--step-y) * 1.5 + var(--hex-h));
        }

        /* Posicionamiento dinámico usando variables CSS (--q, --r) inyectadas en HTML */
        .slot, .piece-wrapper {
            position: absolute;
            width: var(--hex-w);
            height: var(--hex-h);
            left: calc(var(--step-x) * var(--q));
            top: calc(var(--step-y) * (var(--r) + var(--q) / 2));
            transition: transform 0.2s ease;
            z-index: 1;
        }

        .slot-svg {
            width: 100%;
            height: 100%;
            fill: var(--slot-bg);
            stroke: var(--slot-border);
            stroke-width: 2px;
            transition: all 0.3s ease;
        }

        .slot.drag-over .slot-svg {
            fill: #d1d5db;
            stroke: var(--brand-orange);
            stroke-width: 4px;
        }

        /* Piezas y rotación */
        .piece {
            width: var(--hex-w);
            height: var(--hex-h);
            cursor: grab;
            position: relative;
            z-index: 20;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* Crucial para móviles */
        }
        
        .piece:active { cursor: grabbing; }

        .piece-svg-container {
            width: 100%;
            height: 100%;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        .piece-svg {
            width: 100%;
            height: 100%;
            fill: var(--brand-black);
            stroke: var(--brand-white);
            stroke-width: 2px;
        }

        /* Zona de piezas flotantes */
        .piece-dock {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(0.5rem, 2vw, 1.5rem);
            padding: clamp(1rem, 3vw, 2rem);
            border-radius: 1rem;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }

        /* Base para las piezas en el dock para que conserven su tamaño */
        .dock-slot {
            position: relative;
            width: var(--hex-w);
            height: var(--hex-h);
        }

        .piece.in-slot {
            position: absolute;
            top: 0; left: 0;
            z-index: 10;
        }

        /* Capa de arrastre */
        #drag-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 99999;
        }

        .is-dragging {
            pointer-events: none !important; 
            position: absolute !important;
            z-index: 100000;
            transform: scale(1.1);
            transition: transform 0.1s ease;
        }
        
        .is-dragging .piece-svg-container {
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.5));
        }

        /* Estilos del botón de catálogo */
        .btn-locked {
            background-color: #d1d5db !important;
            color: #6b7280 !important;
            cursor: not-allowed;
            box-shadow: none !important;
        }
        
        .btn-unlocked {
            background-color: var(--brand-green) !important;
            color: var(--brand-white) !important;
            box-shadow: 0 10px 15px -3px rgba(99, 124, 46, 0.4) !important;
            cursor: pointer;
            animation: pulse-green 2s infinite;
        }
        
        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(99, 124, 46, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(99, 124, 46, 0); }
            100% { box-shadow: 0 0 0 0 rgba(99, 124, 46, 0); }
        }

        .btn-unlocked:hover {
            background-color: #536926 !important;
        }
    </style>
</head>
<body>

    <!-- Header con el logo solicitado sin texto de respaldo -->
    <header class="w-full p-4 bg-white shadow-sm z-50 flex flex-col sm:flex-row justify-between items-center gap-4">
        <div class="flex items-center justify-center w-full sm:w-auto">
            <img src="Logo HL.png" alt="Logo" style="max-height: 80px; margin: 0 auto; display: block;" />
        </div>
        <div class="flex items-center gap-3 w-full sm:w-auto">
            <button id="skip-btn" class="flex-1 sm:flex-none px-4 py-2.5 bg-white text-[#E66622] border-2 border-[#E66622] rounded-lg font-bold transition-all active:scale-95 hover:bg-orange-50 text-sm whitespace-nowrap">
                Omitir Juego
            </button>
            <button id="catalog-btn" class="flex-1 sm:flex-none px-4 py-2.5 rounded-lg font-bold transition-all text-sm flex items-center justify-center gap-2 btn-locked whitespace-nowrap" disabled>
                <!-- Candado Cerrado -->
                <svg id="icon-locked" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
                <!-- Candado Abierto (Oculto) -->
                <svg id="icon-unlocked" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"></path>
                </svg>
                <span>Ver Catálogo</span>
            </button>
        </div>
    </header>

    <div class="flex-1 relative w-full flex flex-col items-center overflow-hidden">
        
        <main id="game-section" class="active-section flex flex-col items-center flex-1 pb-10 fade-transition">
            <div class="text-center px-4 mt-4 sm:mt-6">
                <h2 class="text-xl sm:text-2xl font-bold text-black">Crea el circuito Naranja</h2>
                <p class="text-gray-500 mt-1 text-xs sm:text-sm max-w-md mx-auto">
                    Coloca las 5 piezas y rótalas (click/tap) para formar un <span class="font-bold text-[#EF9322]">círculo cerrado naranja</span>.
                </p>
            </div>

            <div class="board-container my-4">
                <div class="flat-board" id="board">
                    <!-- Los huecos se posicionan matemáticamente usando las variables --q y --r -->
                    <div class="slot" data-q="0" data-r="1" style="--q: 0; --r: 1;"></div>
                    <div class="slot" data-q="0" data-r="2" style="--q: 0; --r: 2;"></div>
                    <div class="slot" data-q="1" data-r="0" style="--q: 1; --r: 0;"></div>
                    <div class="slot" data-q="1" data-r="1" style="--q: 1; --r: 1;"></div>
                    <div class="slot" data-q="1" data-r="2" style="--q: 1; --r: 2;"></div>
                    <div class="slot" data-q="2" data-r="0" style="--q: 2; --r: 0;"></div>
                    <div class="slot" data-q="2" data-r="1" style="--q: 2; --r: 1;"></div>
                    <div class="slot" data-q="2" data-r="2" style="--q: 2; --r: 2;"></div>
                    <div class="slot" data-q="3" data-r="0" style="--q: 3; --r: 0;"></div>
                    <div class="slot" data-q="3" data-r="1" style="--q: 3; --r: 1;"></div>
                </div>
            </div>

            <div class="w-full max-w-3xl px-4 mt-2">
                <div class="piece-dock" id="dock">
                    <!-- Pieza 0: Naranja recta (1-4), Verde recta (0-3), Morada recta (2-5) -->
                    <div class="dock-slot">
                        <div class="piece" data-id="0" data-rot="0">
                            <div class="piece-svg-container">
                                <svg viewBox="0 0 100 86.6" class="piece-svg">
                                    <polygon points="25,0 75,0 100,43.3 75,86.6 25,86.6 0,43.3" />
                                    <!-- Verde (0 a 3) -->
                                    <path d="M 50,0 L 50,86.6" fill="none" stroke="var(--brand-green)" stroke-width="14" stroke-linecap="round"/>
                                    <!-- Naranja (1 a 4) -->
                                    <path d="M 87.5,21.65 L 12.5,64.95" fill="none" stroke="var(--brand-orange)" stroke-width="14" stroke-linecap="round"/>
                                    <!-- Morado (2 a 5) -->
                                    <path d="M 87.5,64.95 L 12.5,21.65" fill="none" stroke="var(--brand-purple)" stroke-width="14" stroke-linecap="round"/>
                                </svg>
                            </div>
                        </div>
                    </div>
                    <!-- Pieza 1: Naranja curva corta (3-4), Verde curva corta (0-5), Morada curva corta (1-2) -->
                    <div class="dock-slot">
                        <div class="piece" data-id="1" data-rot="0">
                            <div class="piece-svg-container">
                                <svg viewBox="0 0 100 86.6" class="piece-svg">
                                    <polygon points="25,0 75,0 100,43.3 75,86.6 25,86.6 0,43.3" />
                                    <path d="M 50,86.6 Q 25,86.6 12.5,64.95" fill="none" stroke="var(--brand-orange)" stroke-width="14" stroke-linecap="round"/>
                                    <path d="M 12.5,21.65 Q 25,0 50,0" fill="none" stroke="var(--brand-green)" stroke-width="14" stroke-linecap="round"/>
                                    <path d="M 87.5,21.65 Q 100,43.3 87.5,64.95" fill="none" stroke="var(--brand-purple)" stroke-width="14" stroke-linecap="round"/>
                                </svg>
                            </div>
                        </div>
                    </div>
                    <!-- Pieza 2: Naranja curva larga (0-4), Verde curva larga (1-5), Morada curva corta (2-3) -->
                    <div class="dock-slot">
                        <div class="piece" data-id="2" data-rot="0">
                            <div class="piece-svg-container">
                                <svg viewBox="0 0 100 86.6" class="piece-svg">
                                    <polygon points="25,0 75,0 100,43.3 75,86.6 25,86.6 0,43.3" />
                                    <path d="M 50,0 Q 50,43.3 12.5,64.95" fill="none" stroke="var(--brand-orange)" stroke-width="14" stroke-linecap="round"/>
                                    <path d="M 87.5,21.65 Q 50,43.3 12.5,21.65" fill="none" stroke="var(--brand-green)" stroke-width="14" stroke-linecap="round"/>
                                    <path d="M 87.5,64.95 Q 75,86.6 50,86.6" fill="none" stroke="var(--brand-purple)" stroke-width="14" stroke-linecap="round"/>
                                </svg>
                            </div>
                        </div>
                    </div>
                    <!-- Pieza 3: Naranja curva larga (1-5), Verde curva larga (0-2), Morada curva corta (3-4) -->
                    <div class="dock-slot">
                        <div class="piece" data-id="3" data-rot="0">
                            <div class="piece-svg-container">
                                <svg viewBox="0 0 100 86.6" class="piece-svg">
                                    <polygon points="25,0 75,0 100,43.3 75,86.6 25,86.6 0,43.3" />
                                    <path d="M 87.5,21.65 Q 50,43.3 12.5,21.65" fill="none" stroke="var(--brand-orange)" stroke-width="14" stroke-linecap="round"/>
                                    <path d="M 50,0 Q 50,43.3 87.5,64.95" fill="none" stroke="var(--brand-green)" stroke-width="14" stroke-linecap="round"/>
                                    <path d="M 50,86.6 Q 25,86.6 12.5,64.95" fill="none" stroke="var(--brand-purple)" stroke-width="14" stroke-linecap="round"/>
                                </svg>
                            </div>
                        </div>
                    </div>
                    <!-- Pieza 4: Naranja curva corta (1-2), Verde curva larga (3-5), Morada curva larga (0-4) -->
                    <div class="dock-slot">
                        <div class="piece" data-id="4" data-rot="0">
                            <div class="piece-svg-container">
                                <svg viewBox="0 0 100 86.6" class="piece-svg">
                                    <polygon points="25,0 75,0 100,43.3 75,86.6 25,86.6 0,43.3" />
                                    <path d="M 87.5,21.65 Q 100,43.3 87.5,64.95" fill="none" stroke="var(--brand-orange)" stroke-width="14" stroke-linecap="round"/>
                                    <path d="M 50,86.6 Q 50,43.3 12.5,21.65" fill="none" stroke="var(--brand-green)" stroke-width="14" stroke-linecap="round"/>
                                    <path d="M 50,0 Q 50,43.3 12.5,64.95" fill="none" stroke="var(--brand-purple)" stroke-width="14" stroke-linecap="round"/>
                                </svg>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Catálogo final -->
        <main id="catalog-section" class="hidden-section w-full max-w-6xl mx-auto p-6 lg:p-12 fade-transition min-h-[70vh]">
            <div class="mb-10 border-b border-gray-200 pb-4">
                <h2 class="text-3xl font-extrabold text-black">Catálogo de Productos</h2>
                <p class="text-gray-500 mt-2">Explora nuestras opciones disponibles.</p>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div class="bg-white rounded-xl shadow-md border border-gray-100 p-10 flex flex-col items-center justify-center min-h-[250px] hover:shadow-lg transition-shadow cursor-pointer">
                    <div class="w-16 h-16 rounded-full bg-[#E66622] bg-opacity-20 flex items-center justify-center mb-4">
                        <div class="w-8 h-8 rounded-full bg-[#E66622]"></div>
                    </div>
                    <h3 class="text-2xl font-bold text-gray-800">Opción 1</h3>
                </div>
                <div class="bg-white rounded-xl shadow-md border border-gray-100 p-10 flex flex-col items-center justify-center min-h-[250px] hover:shadow-lg transition-shadow cursor-pointer">
                    <div class="w-16 h-16 rounded-full bg-[#1B371C] bg-opacity-20 flex items-center justify-center mb-4">
                        <div class="w-8 h-8 rounded-full bg-[#1B371C]"></div>
                    </div>
                    <h3 class="text-2xl font-bold text-gray-800">Opción 2</h3>
                </div>
                <div class="bg-white rounded-xl shadow-md border border-gray-100 p-10 flex flex-col items-center justify-center min-h-[250px] hover:shadow-lg transition-shadow cursor-pointer">
                    <div class="w-16 h-16 rounded-full bg-[#47336E] bg-opacity-20 flex items-center justify-center mb-4">
                        <div class="w-8 h-8 rounded-full bg-[#47336E]"></div>
                    </div>
                    <h3 class="text-2xl font-bold text-gray-800">Opción 3</h3>
                </div>
            </div>
        </main>
    </div>

    <div id="drag-layer"></div>

    <script>
        const gameSection = document.getElementById('game-section');
        const catalogSection = document.getElementById('catalog-section');
        const skipBtn = document.getElementById('skip-btn');
        const catalogBtn = document.getElementById('catalog-btn');
        const iconLocked = document.getElementById('icon-locked');
        const iconUnlocked = document.getElementById('icon-unlocked');
        
        const dragLayer = document.getElementById('drag-layer');
        const dock = document.getElementById('dock');
        const slots = document.querySelectorAll('.slot');
        const pieces = document.querySelectorAll('.piece');

        // Dibujar hexágonos vacíos de fondo para los huecos
        const emptyHexSVG = `
            <svg viewBox="0 0 100 86.6" class="slot-svg">
                <polygon points="25,0 75,0 100,43.3 75,86.6 25,86.6 0,43.3" />
            </svg>
        `;
        slots.forEach(slot => { slot.innerHTML = emptyHexSVG; });

        let isUnlocked = false;

        function unlockCatalog() {
            if (isUnlocked) return;
            isUnlocked = true;
            
            catalogBtn.classList.remove('btn-locked');
            catalogBtn.classList.add('btn-unlocked');
            catalogBtn.removeAttribute('disabled');
            
            iconLocked.classList.add('hidden');
            iconUnlocked.classList.remove('hidden');
        }

        function showCatalog() {
            if (!isUnlocked) return;
            gameSection.classList.remove('active-section');
            gameSection.classList.add('hidden-section');
            
            setTimeout(() => {
                catalogSection.classList.remove('hidden-section');
                catalogSection.classList.add('active-section');
                skipBtn.style.display = 'none';
            }, 300);
        }

        skipBtn.addEventListener('cli
